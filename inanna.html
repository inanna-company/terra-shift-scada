      let elapsed = 0;
      const step = 0.1;
      return setInterval(() => {
        elapsed += step;
        const rem = Math.max(0, totalSec - elapsed);
        const pct = Math.min(100, (elapsed / totalSec) * 100);
        const dEl = document.getElementById(dispId);
        const bEl = document.getElementById(barId);
        if (dEl) dEl.textContent = `${rem.toFixed(1)} s`;
        if (bEl) {
          bEl.style.width = `${pct}%`;
          if (pct > 85) bEl.style.background = '#ef4444';
        }
        if (rem <= 0) clearInterval(totalSec <= 35 ? timer30 : timer3m);
      }, 100);
    }

                <div style="font-weight:700;color:#ffffff;font-size:0.9rem;margin-bottom:6px;">${item.q}</div>
                <div style="font-size:0.82rem;color:#cbd5e1;line-height:1.52;">${item.a}</div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentLang = btn.dataset.lang;
        localStorage.setItem('inanna_lang', currentLang);
        renderHub();
      });
    });

    renderHub();
  </script>
</body>
</html>
