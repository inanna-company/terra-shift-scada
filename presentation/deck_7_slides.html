      align-items: center;

    }

      top: 12px;
      z-index: 100;
      background: rgba(15, 22, 34, 0.94);

      align-items: center;
      gap: 12px;

      border: none;
      border-radius: 999px;
      padding: 6px 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.8rem;

    .lang-bar {

      padding: 2px;
      gap: 2px;

      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .lang-pill.active {
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #fff;
    }
    .slide {
      width: 1280px;
      height: 720px;
      background:

        radial-gradient(circle at 10% 88%, rgba(24, 144, 255, 0.12), transparent 38%),

      border-radius: 999px;
      font-weight: 700;

      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      font-size: 0.82rem;
    }

      font-size: 3.1rem;
      font-weight: 800;
      line-height: 1.08;
      background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 45%, #00b8e6 100%);

      -webkit-text-fill-color: transparent;
    }
    h2 {
      font-size: 2.02rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .lead {
      font-size: 1.14rem;
      color: #cbd5e1;
      line-height: 1.48;
      max-width: 980px;
    }
    .cols-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 26px;
      flex: 1;
      align-items: stretch;
      margin: 16px 0;
    }
    .cols-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      flex: 1;
      margin: 16px 0;
    }

      background: rgba(17, 24, 36, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;

    .metric {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.05rem;
      font-weight: 800;
      color: #ffffff;
    }
    .slide-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(148, 163, 184, 0.14);
      padding-top: 12px;
      font-size: 0.75rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .slide.narrating-slide {
      border-color: var(--ok);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.55), 0 18px 50px rgba(0, 184, 230, 0.35);

    .deck-eq {
      display: none;
      align-items: center;
      gap: 3px;
      height: 16px;

    .deck-eq.speaking { display: inline-flex; }
    .deck-eq span {

      height: 5px;
      border-radius: 3px;
      background: #10b981;
      animation: deckEqAnim 0.68s ease-in-out infinite alternate;

    .deck-eq span:nth-child(4) { animation-delay: 0.18s; }
    @keyframes deckEqAnim {
      0% { height: 4px; background: #00b8e6; }
      100% { height: 16px; background: #10b981; }
    }
    @page { size: 1280px 720px; margin: 0; }
    @media print {
      body { background: #080c12; padding: 0; gap: 0; }
      .deck-toolbar { display: none !important; }
      .slide { border-radius: 0; border: none; box-shadow: none; page-break-after: always; break-after: page; }
      .slide:last-of-type { page-break-after: auto; break-after: auto; }
    }
  </style>

    function stopDeckNarration() {
      deckNarrating = false;
      if (deckTimer) { clearTimeout(deckTimer); deckTimer = null; }
      if (deckAudio) {
        try { deckAudio.onended = null; deckAudio.pause(); deckAudio.currentTime = 0; } catch (_) {}
        deckAudio = null;
      }
      document.getElementById('deckEq').classList.remove('speaking');
      document.querySelectorAll('.slide').forEach(el => el.classList.remove('narrating-slide'));
      const d = DECK[activeLang] || DECK.en;
      document.getElementById('tbVoice').textContent = d.tbVoiceStart;
    }

    function playDeckSlide(idx) {
      if (!deckNarrating || idx >= 7) {
        stopDeckNarration();
        return;
      }
      const slides = document.querySelectorAll('.slide');
      slides.forEach((el, i) => el.classList.toggle('narrating-slide', i === idx));
      if (slides[idx]) slides[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });

      const audio = new Audio(`../assets/audio/slide_${activeLang}_${idx}.mp3?v=pure6`);
      deckAudio = audio;
      audio.onplay = () => document.getElementById('deckEq').classList.add('speaking');
      audio.onended = () => {
        document.getElementById('deckEq').classList.remove('speaking');
        if (deckNarrating) {
          deckTimer = setTimeout(() => playDeckSlide(idx + 1), 950);
        }
      };
      audio.onerror = () => stopDeckNarration();
      audio.play().catch(() => stopDeckNarration());
    }

    function toggleDeckNarration() {
      if (deckNarrating) {
        stopDeckNarration();
        return;

            <div class="slide-foot">
              <span>${s.footL}</span>
              <span>TERRA-SHIFT SCADA</span>
            </div>
          </section>
        `;
      }).join('');

      if (wasNarrating) toggleDeckNarration();
    }

    const params = new URLSearchParams(window.location.search);
    const initLang = ['en', 'es', 'pt'].includes(params.get('lang')) ? params.get('lang') : 'en';
    renderDeck(initLang);

    document.querySelectorAll('.lang-pill').forEach(btn => {
      btn.addEventListener('click', () => renderDeck(btn.dataset.lang));
    });
  </script>
</body>
</html>
