      document.getElementById('tbBack').textContent = d.tbBack;
      document.getElementById('tbBack').href = `../index.html?lang=${lang}`;
      document.getElementById('tbPdf').textContent = d.tbPdf;

      document.querySelectorAll('.lang-pill').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });

      const root = document.getElementById('slidesRoot');
      root.innerHTML = d.slides.map((s, idx) => {
        const num = `SLIDE 0${idx + 1} / 07`;
        if (s.hero) {
          return `
            <section class="slide">
              <div class="slide-top">
                <span class="tag">${s.tag}</span>
                <span class="slide-num">${num}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:18px;margin:auto 0;">
                <div style="display:inline-flex;align-items:center;gap:16px;flex-wrap:wrap;">
                  <img src="../assets/inanna-logo-horizontal.jpg" alt="INANNA COMPANY Official Brand" style="height:64px;border-radius:8px;border:1px solid rgba(0,184,230,0.48);box-shadow:0 0 22px rgba(0,184,230,0.22);" />
                  <span style="font-family:'JetBrains Mono',monospace;color:#94a3b8;font-size:0.9rem;">AUTOMATION • AI • INDUSTRIES • LABS • SERVICE INANNA</span>
                </div>
                <h1>TERRA-SHIFT SCADA</h1>
                <p class="lead" style="font-size:1.3rem;color:#e2e8f0;">${s.sub}</p>
                <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;">
                  <div class="box" style="padding:14px 20px;">
                    <div style="font-size:0.75rem;color:#94a3b8;text-transform:uppercase;">${s.teamLbl}</div>
                    <div style="font-weight:700;color:#fff;">Fabio Maximiliano Medina Rojas (Mechatronics Lead) • Agustín Alejandro Debia • Iván David Coria</div>
                  </div>
                  <div class="box" style="padding:14px 20px;">
                    <div style="font-size:0.75rem;color:#94a3b8;text-transform:uppercase;">${s.eventLbl}</div>
                    <div style="font-weight:700;color:#00b8e6;">Santa Rosa de Calamuchita, Córdoba, Argentina</div>
                  </div>
                </div>
              </div>
              <div class="slide-foot">
                <span>TEAM INANNA COMPANY • SANTA ROSA DE CALAMUCHITA</span>
                <span>${s.footR}</span>
              </div>
            </section>
          `;
        }

        const gridHtml = s.cols3
          ? `<div class="cols-3">${s.cols3.map(c => `
              <div class="box" style="${c.border ? 'border-color:' + c.border : ''}">
                <h3>${c.h3}</h3>
                ${c.m ? `<div class="metric" style="color:${c.mCol || '#fff'}">${c.m}</div>` : ''}

              </div>`).join('')}</div>`

              <div class="box" style="${c.border ? 'border-color:' + c.border : ''}">
                <h3>${c.h3}</h3>
                ${c.ul ? `<ul>${c.ul.map(li => `<li>${li}</li>`).join('')}</ul>` : `<p>${c.p}</p>`}

        return `
          <section class="slide">
            <div class="slide-top">
              <span class="tag">${s.tag}</span>
              <span class="slide-num">${num}</span>
            </div>
            <div>
              <h2>${s.h2}</h2>
              <p class="lead">${s.lead}</p>

            ${gridHtml}
            <div class="slide-foot">
              <span>${s.footL}</span>
              <span>TERRA-SHIFT SCADA</span>
